<!DOCTYPE html>
<html lang="id">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math-O-Volume: Chaos Edition</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f0f0f0;
            margin: 0;
        }

        #app {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 400px;
        }

        .timer {
            font-size: 2rem;
            color: #e74c3c;
            font-weight: bold;
            margin: 10px 0;
        }

        input {
            padding: 10px;
            font-size: 1.2rem;
            width: 80%;
            border: 2px solid #ddd;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: 0.3s;
        }

        .btn-main {
            background: #3498db;
            color: white;
        }

        .btn-giveup {
            background: #e67e22;
            color: white;
            margin-top: 10px;
        }

        .stats {
            margin-top: 20px;
            font-weight: bold;
            color: #2c3e50;
        }

        /* Animasi Getar untuk Jawaban Salah */
        .shake {
            animation: shake-animation 0.5s;
        }

        /* 🔴 Flash merah */
        .flash-red {
            animation: flash-red 0.4s;
        }

        @keyframes flash-red {
            0% {
                background-color: rgba(255, 0, 0, 0.7);
            }

            100% {
                background-color: transparent;
            }
        }

        /* 🎥 Camera Shake (seluruh layar) */
        .camera-shake {
            animation: camera-shake 0.4s;
        }

        @keyframes camera-shake {
            0% {
                transform: translate(0, 0);
            }

            20% {
                transform: translate(-10px, 5px);
            }

            40% {
                transform: translate(10px, -5px);
            }

            60% {
                transform: translate(-8px, 4px);
            }

            80% {
                transform: translate(8px, -4px);
            }

            100% {
                transform: translate(0, 0);
            }
        }

        /* Style Tombol Stop */
        .btn-stop {
            background: #2ecc71;
            color: white;
            margin-top: 10px;
        }

        /* 📱 RESPONSIVE MOBILE */
        @media (max-width: 480px) {
            body {
                padding: 10px;
                align-items: flex-start;
                /* biar tidak kepotong atas */
            }

            #app {
                width: 100%;
                padding: 20px;
                border-radius: 10px;
            }

            h2 {
                font-size: 1.4rem;
            }

            .timer {
                font-size: 1.6rem;
            }

            input {
                width: 100%;
                font-size: 1rem;
                padding: 12px;
            }

            button {
                width: 100%;
                padding: 12px;
                font-size: 1rem;
                margin-top: 5px;
            }

            .btn-stop,
            .btn-giveup {
                width: 100%;
            }

            .stats {
                font-size: 0.9rem;
            }

            #question {
                font-size: 1.1rem;
            }
        }
    </style>
</head>

<body>

    <div id="app">
        <h2>🔊 Math-O-Volume</h2>

        <!-- Tombol Start -->
        <div id="start-screen">
            <p>Siap untuk ujian volume?</p>
            <button class="btn-start" onclick="startGame()">MULAI SEKARANG</button>
        </div>

        <!-- Area Game -->
        <div id="game-area" style="display: none;">
            <div id="timer" class="timer">5s</div>
            <div id="quiz-container">
                <p id="question">Berapa hasil dari...</p>

                <p id="statusText" style="font-weight:bold; min-height:20px;"></p>

                <input type="number" id="answer" placeholder="Jawaban">
                <br>
                <button class="btn-main" onclick="checkAnswer()">Kirim Jawaban</button>
            </div>

            <br>
            <!-- Tombol Baru -->
            <button class="btn-stop" onclick="stopGame()">Selesai & Kunci Volume ✅</button>
            <br>
            <button class="btn-giveup" onclick="giveUp()">SAYA MENYERAH! 🏳️</button>
        </div>

        <div class="stats">
            Volume: <span id="volDisplay">100%</span> | Salah: <span id="strikeDisplay">0</span>
        </div>

        <audio id="mainAudio" src="./sound/never-gonna-meow-you-up.mp3" loop preload="auto" crossorigin="anonymous">
        </audio>
    </div>

    <script>
        let currentVolume = 1.0;
        let strikes = 0;
        let timeLeft = 5;
        let timerInterval;
        let correctAnswer;
        let audioCtx, gainNode;
        let distortionNode;

        const sounds = {
            wrong1: new Audio("./sound/fahhhhhhhhhhhhhh.mp3"),
            wrong2: new Audio("./sound/dun-dun-dun-sound-effect-brass_8nFBccR.mp3"),
            wrong3: new Audio("./sound/brother-ewwwwwww.mp3"),
            timeout: new Audio("./sound/a-few-moments-later-sponge-bob-sfx-fun.mp3"),
            surrender: new Audio("./sound/downer_noise.mp3")
        };

        let isSfxPlaying = false;

        function playSfx(sound) {
            const audioEle = document.getElementById('mainAudio');

            if (!isSfxPlaying) {
                audioEle.pause();
            }

            isSfxPlaying = true;

            sound.currentTime = 0;
            sound.play();

            sound.onended = () => {
                isSfxPlaying = false;
                audioEle.play().catch(() => { });
            };
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const audioEle = document.getElementById('mainAudio');
                const source = audioCtx.createMediaElementSource(audioEle);
                gainNode = audioCtx.createGain();
                source.connect(gainNode).connect(audioCtx.destination);
                audioEle.play();
                generateQuestion();
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 5;
            document.getElementById('timer').innerText = timeLeft + "s";

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft + "s";
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeout();
                }
            }, 1000);
        }

        // function generateQuestion() {
        //     const a = Math.floor(Math.random() * 20) + 1;
        //     const b = Math.floor(Math.random() * 20) + 1;
        //     correctAnswer = a + b;
        //     document.getElementById('question').innerText = `Cepat! Berapa ${a} + ${b}?`;
        //     startTimer();
        // }

        function generateQuestion() {
            const qEl = document.getElementById('question');

            const operators = ["+", "-", "*", "/"];
            const op = operators[Math.floor(Math.random() * operators.length)];

            let a, b;

            switch (op) {
                case "+":
                    a = Math.floor(Math.random() * 50) + 1;
                    b = Math.floor(Math.random() * 50) + 1;
                    correctAnswer = a + b;
                    qEl.innerText = `Cepat! ${a} + ${b} = ?`;
                    break;

                case "-":
                    a = Math.floor(Math.random() * 50) + 1;
                    b = Math.floor(Math.random() * 50) + 1;

                    // biar tidak negatif
                    if (b > a) [a, b] = [b, a];

                    correctAnswer = a - b;
                    qEl.innerText = `Cepat! ${a} - ${b} = ?`;
                    break;

                case "*":
                    a = Math.floor(Math.random() * 20) + 1;
                    b = Math.floor(Math.random() * 20) + 1;
                    correctAnswer = a * b;
                    qEl.innerText = `Cepat! ${a} × ${b} = ?`;
                    break;

                case "/":
                    b = Math.floor(Math.random() * 10) + 1;
                    correctAnswer = Math.floor(Math.random() * 10) + 1;
                    a = correctAnswer * b; // biar hasil bulat

                    qEl.innerText = `Cepat! ${a} ÷ ${b} = ?`;
                    break;
            }

            startTimer();
        }

        function makeDistortionCurve(amount) {
            const k = typeof amount === 'number' ? amount : 50;
            const n_samples = 44100;
            const curve = new Float32Array(n_samples);
            const deg = Math.PI / 180;

            for (let i = 0; i < n_samples; ++i) {
                const x = i * 2 / n_samples - 1;
                curve[i] = (3 + k) * x * 20 * deg / (Math.PI + k * Math.abs(x));
            }
            return curve;
        }

        function startGame() {
            noAnswerCount = 0;

            const audioEle = document.getElementById('mainAudio');

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const audioEle = document.getElementById('mainAudio');

                const source = audioCtx.createMediaElementSource(audioEle);

                gainNode = audioCtx.createGain();
                // distorsi
                distortionNode = audioCtx.createWaveShaper();

                source
                    .connect(distortionNode)
                    .connect(gainNode)
                    .connect(audioCtx.destination);
            }

            audioCtx.resume();

            audioEle.play().catch(err => {
                console.error("Audio gagal:", err);
            });

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('game-area').style.display = 'block';

            generateQuestion();
        }

        function stopGame() {
            clearInterval(timerInterval);

            const audioEle = document.getElementById('mainAudio');
            audioEle.pause();
            audioEle.currentTime = 0;

            document.getElementById('start-screen').style.display = 'block';
            document.getElementById('game-area').style.display = 'none';
            document.getElementById('answer').value = "";

            noAnswerCount = 0;

            console.log("Game selesai.");
        }

        function checkAnswer() {
            const answerInput = document.getElementById('answer');
            const userAnswer = parseInt(answerInput.value);

            if (isNaN(userAnswer)) {
                alert("Isi dulu jawabannya, jangan buru-buru!");
                return;
            }

            clearInterval(timerInterval);
            noAnswerCount = 0;

            if (userAnswer === correctAnswer) {
                currentVolume = Math.min(currentVolume + 0.2, 3.0);
                strikes = 0;
                updateUI("Pinter!");

                generateQuestion();
            } else {
                handleWrong();
            }

            answerInput.value = "";
        }

        function handleWrong() {
            strikes++;
            currentVolume = Math.max(currentVolume - 0.2, 0);

            const quiz = document.getElementById('quiz-container');
            const app = document.getElementById('app');

            quiz.classList.add('shake');
            document.body.classList.add('flash-red');
            app.classList.add('camera-shake');

            setTimeout(() => {
                quiz.classList.remove('shake');
                document.body.classList.remove('flash-red');
                app.classList.remove('camera-shake');
            }, 400);

            // 🔊 Sound
            if (strikes === 1) {
                playSfx(sounds.wrong1);
            } else if (strikes === 2) {
                playSfx(sounds.wrong2);
            } else if (strikes === 3) {
                playSfx(sounds.wrong3);
            }

            updateUI("SALAH!");

            setTimeout(() => {
                if (strikes >= 3) {
                    strikes = 0;
                }
                generateQuestion();
            }, 800);
        }

        function handleTimeout() {
            playSfx(sounds.timeout);
            currentVolume = Math.max(currentVolume - 0.3, 0);

            noAnswerCount++; // tambah counter

            if (noAnswerCount >= 3) {
                alert("Kamu tidak menjawab 3x. Game selesai!");
                stopGame();
                return;
            }

            updateUI("LEMOT!");
            generateQuestion();
        }

        function giveUp() {
            clearInterval(timerInterval);
            playSfx(sounds.surrender);

            currentVolume = 0;
            updateUI("MENYERAH");

            setTimeout(() => {
                stopGame();
            }, 1000);
        }

        function updateUI(msg) {
            if (gainNode) gainNode.gain.value = currentVolume;

            if (distortionNode) {
                let chaosLevel = currentVolume * 100;
                distortionNode.curve = makeDistortionCurve(chaosLevel);
                distortionNode.oversample = '4x';
            }

            document.getElementById('volDisplay').innerText = Math.round(currentVolume * 100) + "%";
            document.getElementById('strikeDisplay').innerText = strikes;
            document.getElementById('statusText').innerText = msg;
        }
    </script>
</body>

</html>
